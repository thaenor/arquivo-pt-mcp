[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arquivo-pt-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Arquivo.pt — the Portuguese Web Archive"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Xico" }]
keywords = ["arquivo.pt", "mcp", "web-archive", "portuguese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.0",
    "pydantic>=2.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

[project.scripts]
arquivo-pt-mcp = "arquivo_pt_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arquivo_pt_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live arquivo.pt API (skip by default, run with RUN_INTEGRATION=1)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["arquivo_pt_mcp"]